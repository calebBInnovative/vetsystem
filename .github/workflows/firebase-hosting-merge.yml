name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check DB schema version is committed
        run: node scripts/bump-db-version.mjs --check
      - name: Check Firebase rewrites are committed
        run: node scripts/generate-firebase-rewrites.mjs --check
      - name: Build
        run: npm run build
        env:
          # Optional: when these secrets are absent the build still succeeds and
          # only the source map upload is skipped.
          # The DSN is public by design — it ships inside the client bundle, like
          # the Firebase web keys — so it belongs in a variable. Secrets are
          # accepted as a fallback in case it was stored there.
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN:      ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:             calebbinnovative
          SENTRY_PROJECT:         javascript-nextjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_VETSYSTEM_B7675 }}
          channelId: live
          projectId: vetsystem-b7675
